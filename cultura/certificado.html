<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Certificado | Cultura Cybersec360</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a1220">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="cultura.css">
</head>
<body data-pagina="certificado">
  <header class="topo-simples">
    <nav class="nav container" aria-label="Área de Cultura">
      <a href="./" class="marca"><img src="../assets/img/logo-icone.png" alt="" width="44" height="44"><span>CYBERSEC<b>360</b></span><em class="area-nome">Cultura</em></a>
      <a class="voltar-site" href="/">&larr; cybersec360.com.br</a>
    </nav>
  </header>
  <main class="container secao-cultura">
    <form id="verificar" class="verificar">
      <label>Verificar certificado
        <input id="codigo-cert" type="text" placeholder="Código do certificado" required>
      </label>
      <button class="botao" type="submit">Verificar</button>
    </form>
    <div id="certificado" hidden>
      <article class="certificado">
        <img src="../assets/img/logo-cybersec360.jpg" alt="Cybersec360" width="220" height="122">
        <p class="cert-titulo">Certificado de Conclusão</p>
        <p>Certificamos que</p>
        <p class="cert-nome"><span id="c-nome"></span> <span id="c-empresa" class="cert-empresa"></span></p>
        <p>concluiu o curso</p>
        <p class="cert-curso" id="c-curso"></p>
        <p>com carga horária de <strong id="c-carga"></strong> e aproveitamento de <strong id="c-nota"></strong>, em <strong id="c-data"></strong>.</p>
        <div class="cert-rodape">
          <p>Código: <strong id="c-codigo"></strong></p>
          <p>Verifique em: <span id="c-link"></span></p>
        </div>
      </article>
      <p class="centro nao-imprimir"><button class="botao" type="button" onclick="window.print()">Imprimir ou salvar em PDF</button></p>
    </div>
  </main>
  <footer class="rodape rodape-cultura">
    <p class="copy">© <span id="ano">2026</span> cybersec360 · Área de Cultura em Segurança da Informação · <a href="/privacidade.html">Privacidade</a></p>
  </footer>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="cultura.js"></script>
  <script>document.getElementById('ano').textContent = new Date().getFullYear();</script>
</body>
</html>
